<style>
:root{color-scheme:dark;--bg:#14112b;--bg2:#1f1a45;--card:#2a2459;--ink:#0b0919;--tx:#fff8e7;--mu:#aaa4d8;--lime:#c6ff3d;--coral:#ff5d73;--cyan:#38e1ff;--yel:#ffd23f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px) 0 0/22px 22px;color:var(--tx);font:700 16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:18px 16px 44px}
.logo{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.logo svg{width:54px;height:54px;flex:none;filter:drop-shadow(0 4px 0 var(--ink))}
h1{font:400 66px/1 "Lilita One",Impact,sans-serif;margin:0;color:var(--yel);letter-spacing:1px;text-shadow:0 5px 0 var(--ink),3px 3px 0 var(--coral)}
h2{font:400 28px/1.1 "Lilita One",Impact,sans-serif;margin:6px 0 12px;letter-spacing:.5px}
p.s{color:var(--mu);margin:6px 0 20px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:0 6px 0 var(--ink)}
button{font:400 19px "Lilita One",Impact,sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yel);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;cursor:pointer;width:100%;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.p{background:var(--lime)}
button.g{background:transparent;color:var(--mu);border-color:transparent;box-shadow:none;margin-top:8px}
button:disabled{opacity:.45;filter:grayscale(.6)}
.step button{background:var(--cyan);width:48px;padding:6px 0;font-size:24px}
.mode{display:block;position:relative;border:3px solid var(--ink);border-radius:24px;padding:20px 18px 18px;margin-bottom:18px;box-shadow:0 7px 0 var(--ink);color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.mode b{display:block;font:400 30px/1.1 "Lilita One",Impact,sans-serif}
.mode span{display:block;font-weight:800;opacity:.75;margin-top:2px}
.mode i{position:absolute;right:14px;top:14px;font:400 13px "Lilita One";font-style:normal;background:var(--ink);color:var(--tx);padding:3px 10px;border-radius:99px}
.m1{background:var(--lime)}.m2{background:var(--cyan)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
input{font:800 17px Nunito,sans-serif;color:var(--tx);background:#0e0c26;border:3px solid var(--ink);border-radius:14px;padding:13px;width:100%;margin-bottom:12px;outline:none}
input:focus{border-color:var(--lime)}
input.code{text-align:center;letter-spacing:10px;font:400 34px "Lilita One";text-transform:uppercase}
.step{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:10px}
.step b{font:400 30px "Lilita One";min-width:34px;text-align:center}
.big{font:400 70px/1 "Lilita One",Impact,sans-serif;text-align:center;font-variant-numeric:tabular-nums;color:var(--yel);text-shadow:0 5px 0 var(--ink)}
.big.lose{color:var(--coral)}
.role{text-align:center;padding:30px 14px 26px;border-radius:24px;border:3px solid var(--ink);background:var(--yel);color:var(--ink);box-shadow:0 8px 0 var(--ink);transform:rotate(-1.2deg)}
.role.spy{background:var(--coral);color:#fff}
.role small{display:block;font:400 14px "Lilita One";letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.role .n{font:400 38px/1.1 "Lilita One",Impact,sans-serif}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.grid div{padding:10px 6px;border-radius:12px;border:2.5px solid var(--ink);background:var(--bg2);font-size:14px;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.grid div.x{opacity:.35;text-decoration:line-through;box-shadow:none}
.grid div.on{background:var(--lime);color:var(--ink)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;border:2.5px solid var(--ink);background:var(--bg2);margin-bottom:9px;box-shadow:0 3px 0 var(--ink)}
.pl.v{cursor:pointer}.pl.sel{background:var(--cyan);color:var(--ink)}.pl.sel .tag{color:var(--ink)}
.rl{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;padding:0 4px}.rl[hidden]{display:none}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:3px 11px;font-size:13px}
.tag{font-size:12px;color:var(--mu);font-weight:800}
.room{display:inline-block;background:var(--lime);color:var(--ink);border:3px solid var(--ink);padding:0 14px;border-radius:12px;letter-spacing:6px;font:400 26px "Lilita One";box-shadow:0 3px 0 var(--ink);vertical-align:middle}
.res{text-align:center;font:400 30px/1.15 "Lilita One",Impact,sans-serif;margin:6px 0}
.win{color:var(--lime)}.lose{color:var(--coral)}
.note{color:var(--mu);font-size:13px;text-align:center;margin-top:10px;font-weight:700}
.lang{display:flex;gap:6px;justify-content:flex-end}.lang button{width:auto;font-size:14px;padding:4px 11px;box-shadow:0 3px 0 var(--ink)}
html[lang=ru] h2,html[lang=ru] button,html[lang=ru] .mode b,html[lang=ru] .role .n,html[lang=ru] .res,html[lang=ru] .room,html[lang=ru] .step b{font-weight:800}
.qr svg{width:100%;height:auto;display:block}
</style>
</head>

const LOCS=D.map(d=>d[0]),ROLES=D.map(d=>d[1].split(","));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const maxSp=n=>n>=20?5:n>=15?4:n>=9?3:n>=4?2:1;
const decs=(AL,AR,ln,k)=>shuf(AL.map((n,i)=>i).filter(i=>AL[i]!==ln)).reduce((o,i)=>{if(o.length<k&&!o.some(d=>d[0]===AL[i]))o.push([AL[i],AR[i]]);return o},[]);
let CU=[];try{CU=JSON.parse(localStorage.getItem("casus_cu")||"[]")}catch(e){}
const allL0=()=>LOCS.concat(CU.map(c=>c.n)),allR0=()=>ROLES.concat(CU.map(c=>c.r));
const allL=()=>allL0().filter(n=>!S.off[n]),allR=()=>{const r=allR0();return allL0().map((n,i)=>[n,r[i]]).filter(x=>!S.off[x[0]]).map(x=>x[1])};
const PB=()=>`<button data-a="pool" style="margin-bottom:16px;background:${allL().length<6?"var(--coral)":"var(--cyan)"}">Mekânlar: ${allL().length} / ${allL0().length} · seç</button>`;
const gl=g=>g.pl?g.pl.slice():g.sp?LOCS.slice():allL();
const isS=g=>(g.sp||[]).includes(pid);
const myRole=g=>{const bl=g.blind&&isS(g),r=bl?g.dc[pid][1]:g.lr,i=Math.max(0,(g.ord||[]).indexOf(pid));return r[(i+(g.r||0))%r.length]};
const showLoc=g=>g.blind&&isS(g)?g.dc[pid][0]:g.ln;
const SPC=n=>`<div class="card"><div class="step" style="margin:0"><span>Casus sayısı<br><span class="tag">En fazla ${maxSp(n)} · gizli modda her casusa ayrı mekân</span></span><span class="row" style="flex:none"><button data-a="s-">−</button><b>${Math.min(S.sp||1,maxSp(n))}</b><button data-a="s+">+</button></span></div></div>`;
const BL=()=>`<div class="card"><div class="step" style="margin:0"><span>Gizli casus<br><span class="tag">Casus kendini normal oyuncu sanır</span></span><button data-a="bl" class="${S.blind?"p":""}" style="width:96px">${S.blind?"Açık":"Kapalı"}</button></div></div>`;
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const pid=Math.random().toString(36).slice(2,10);
let S={off:{},scr:"home",n:4,dur:8,name:"",err:"",strike:{},show:false,guessing:false,vote:null};
let L=null,R=null,roomApi=null,cr=null;

function go(scr){if(scr==="home"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}S.scr=scr;S.err="";render()}
function render(){
  const f=S.scr;
  if(f==="home")home();else if(f==="lset")lset();else if(f==="lcard")lcard();else if(f==="lplay")play(true);
  else if(f==="rmenu")rmenu();else if(f==="cust")cust();else if(f==="pool")pool();else if(f==="locs")locs();else if(f==="room")roomView();
}
function head(){return `<h1>CASUS</h1><p class="s">Mekânı bil, casusu bul. Ya da casussan, kimseye sezdirme.</p>`}
function home(){
  $.innerHTML=`<div class="lang">${["tr","en","de","az","ru"].map(c=>`<button data-a="lg" data-i="${c}" class="${c===LANG?"p":""}">${c.toUpperCase()}</button>`).join("")}</div><div class="logo"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="13" fill="#2a2459" stroke="#c6ff3d" stroke-width="6"/><path d="M30 30l13 13" stroke="#c6ff3d" stroke-width="8" stroke-linecap="round"/><circle cx="20" cy="20" r="4.5" fill="#ff5d73"/></svg><h1>CASUS</h1></div><p class="s">Mekânı bul, casusu yakala.</p>
<div class="mode m1" data-a="lset"><i>3–20 kişi</i><b>Tek telefon</b><span>Telefonu elden ele dolaştırın</span></div>
<div class="mode m2" data-a="rmenu"><i>kod · link · QR</i><b>Oda kur / katıl</b><span>Herkes kendi telefonundan oynar</span></div>
<div class="row"><button data-a="locs">Mekânlar</button><button data-a="cust">Mekân ekle (${CU.length})</button></div>`;
}
function lset(){
  $.innerHTML=`<h2>Tek telefon</h2><div class="card"><div class="step"><span>Oyuncu sayısı</span><span class="row" style="flex:none"><button data-a="n-">−</button><b>${S.n}</b><button data-a="n+">+</button></span></div>
  <div class="step"><span>Süre (dk)</span><span class="row" style="flex:none"><button data-a="d-">−</button><b>${S.dur}</b><button data-a="d+">+</button></span></div></div>
  ${SPC(S.n)}${BL()}${PB()}${NM()}<button class="p" data-a="lstart" ${allL().length<6?"disabled":""}>Kartları dağıt</button><button class="g" data-a="home">Geri</button>`;
}
function lcard(){
  const i=L.i,isSp=L.spies.includes(i),spy=isSp&&!L.blind,dd=isSp&&L.blind?L.dec[i]:null,ln=dd?dd[0]:L.ln,lr=dd?dd[1]:L.lr;
  $.innerHTML=`<h2>${esc(nmL(L,i))} <span class="tag">${i+1} / ${L.n}</span></h2>`+(L.shown?`<div class="role ${spy?"spy":""}"><small>${spy?"Rolün":"Mekân"}</small><div class="n">${spy?"CASUSSUN":esc(ln)}</div>${spy?"":`<div style="margin-top:10px;font-size:18px">Rolün: <b>${esc(lr[i%lr.length])}</b></div>`}</div><div style="height:12px"></div><button class="p" data-a="lhide">Gizle ve ilerle</button>`

  else if(a==="s-"||a==="s+"){const c=S.scr==="lset"?S.n:cur().players.length,v=Math.min(S.sp||1,maxSp(c))+(a==="s+"?1:-1);S.sp=Math.max(1,Math.min(maxSp(c),v));S.scr==="lset"?lset():roomView()}
  else if(a==="bl"){S.blind=!S.blind;S.scr==="lset"?lset():roomView()}
  else if(a==="cp"||a==="sh"){const u=invU(),m=document.getElementById("cpm");
    if(a==="sh"&&navigator.share){try{await navigator.share({title:"Casus",text:"Odaya gel! Kod: "+cr,url:u});return}catch(e){}}
    try{await navigator.clipboard.writeText(u);if(m)m.textContent="Kopyalandı ✓"}catch(e){if(m)m.textContent="Linki elle kopyala: "+u}}
  else if(a==="lg"){LANG=i;try{localStorage.setItem("casus_lang",i)}catch(e){}document.documentElement.lang=i;go("home")}
  else if(a==="ll"){const e=document.getElementById("ll");e.hidden=!e.hidden}
  else if(a==="q"){S.q=nextQ();const e=document.getElementById("qt");if(e)e.textContent=S.q}
  else if(a==="cust"){go("cust")}
  else if(a==="locs"){go("locs")}
  else if(a==="cx"){const e=document.getElementById("cx"+i);e.hidden=!e.hidden}
  else if(a==="lx"){const e=document.getElementById("rl"+i);e.hidden=!e.hidden}
  else if(a==="pool"){S.from=S.scr;S.scr="pool";pool()}
  else if(a==="pback"){S.scr=S.from||"home";render()}
  else if(a==="pt"){S.off[i]=!S.off[i];t.classList.toggle("x");t.classList.toggle("on");document.getElementById("pc").textContent=allL().length+" / "+allL0().length+" seçili · en az 6"}
  else if(a==="pall"){S.off={};pool()}
  else if(a==="pnone"){allL0().forEach(n=>S.off[n]=true);pool()}
  else if(a==="cadd"){const n=document.getElementById("cn").value.trim(),r=document.getElementById("cr").value.split(/[,;]/).map(x=>x.trim()).filter(Boolean).slice(0,12);
    if(!n||r.length<3){S.err="Bir ad ve en az 3 rol gir.";return cust()}
    CU.push({n:n.slice(0,24),r:r.map(x=>x.slice(0,26))});try{localStorage.setItem("casus_cu",JSON.stringify(CU))}catch(e){}S.err="";cust()}
  else if(a==="cdel"){CU.splice(+i,1);try{localStorage.setItem("casus_cu",JSON.stringify(CU))}catch(e){}cust()}
  else if(a==="lshow"){L.shown=true;lcard()}
  else if(a==="lhide"){L.shown=false;L.i++;if(L.i>=L.n){L.t0=Date.now();go("lplay")}else lcard()}
  else if(a==="lend"){L.vote=true;L.sel=[];L.guessing=false;play(true)}
  else if(a==="lv"){const x=+i,N=L.spies.length;if(L.sel.includes(x))L.sel=L.sel.filter(y=>y!==x);else if(N===1)L.sel=[x];else if(L.sel.length<N)L.sel.push(x);play(true)}
  else if(a==="lres"){const a2=L.sel.slice().sort((p,q)=>p-q).join(),b2=L.spies.slice().sort((p,q)=>p-q).join();L.res={caught:a2===b2,sel:L.sel.slice()};L.ended=true;L.tEnd=Date.now();play(true)}
  else if(a==="lgs"){L.guessing=true;play(true)}
  else if(a==="lgp"){L.res={guess:i,correct:i===L.ln};L.ended=true;L.tEnd=Date.now();play(true)}
  else if(a==="lvb"){L.guessing=false;play(true)}
  else if(a==="lback"){L.vote=false;L.guessing=false;play(true)}
  else if(a==="st"){S.strike[i]=!S.strike[i];t.classList.toggle("x")}
  else if(a==="rmake"||a==="rjoin"){
    S.name=(document.getElementById("nm").value||"").trim()||"Oyuncu";try{localStorage.setItem("casus_nm",S.name)}catch(e){}
    if(a==="rmake"){const c=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");await enter(c,true)}
    else{const c=(document.getElementById("cd").value||"").trim().toUpperCase();if(c.length!==4){S.err="4 harfli kodu gir.";return rmenu()}await enter(c,false)}
  }
  else if(a==="rstart"){const g=cur(),pl=g.players,AL=allL(),AR=allR(),lc=Math.floor(Math.random()*AL.length),sp=Math.min(S.sp||1,maxSp(pl.length)),spl=shuf(pl.map(p=>p.id)).slice(0,sp),dc={};decs(AL,AR,AL[lc],sp).forEach((d,k)=>dc[spl[k]]=d);S.vote=null;S.show=false;S.guessing=false;S.strike={};await roomApi.presence({vote:null,guess:null});await hostSet({ph:"play",ln:AL[lc],lr:AR[lc],dc:S.blind?dc:{},blind:!!S.blind,sp:spl,...(CU.length||Object.values(S.off).some(Boolean)?{pl:AL}:{}),ord:pl.map(p=>p.id),t0:Date.now(),dur:S.dur*60,r:Date.now()})}
  else if(a==="rnew"){await hostSet({ph:"lobby",r:Date.now()})}
  else if(a==="rend"){const g=cur();await hostSet({ph:"end",ln:g.ln,lr:g.lr,dc:g.dc,blind:g.blind,sp:g.sp,pl:g.pl,ord:g.ord,t0:g.t0,dur:g.dur,r:g.r})}
  else if(a==="rtog"){S.show=!S.show;roomView()}
  else if(a==="vt"){S.vote=i;await roomApi.presence({vote:i});roomView()}
  else if(a==="gstart"){S.guessing=true;roomView()}
  else if(a==="gs"){await roomApi.presence({guess:i})}
  else if(a==="rleave"){await roomApi.presence({id:null,host:null});roomApi.leave();roomApi=null;go("home")}
});
try{S.name=localStorage.getItem("casus_nm")||""}catch(e){}
const hm=location.hash.match(/^#oda-([a-z]{4})$/i);
if(hm){S.pre=hm[1].toUpperCase();S.scr="rmenu";if(S.name){render();enter(S.pre,false)}else{render()}}else render();
</script>
